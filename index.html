<html>
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESG online survey v1 [PsychoPy]</title>

  <style>

/* Phone/tablet-only survey layout, preserving the original PsychoJS on desktops. */
#esg-mobile-survey { display:none; }
#esg-mobile-survey *, #esg-mobile-survey *::before, #esg-mobile-survey *::after {box-sizing:border-box;}
.esg-mobile-mode body { margin:0; background:#fff; }
.esg-mobile-mode #root { pointer-events:none; opacity:0; }
.esg-mobile-mode #esg-mobile-survey {
 display:flex; flex-direction:column; position:fixed; z-index:99999; inset:0;
 background:#fff; color:#172033; font:400 17px/1.65 Meiryo,"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased; }
.esm-main { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
 padding:clamp(20px,4vw,42px) clamp(16px,4.5vw,48px) 38px;
 margin:0 auto; width:100%; max-width:900px; -webkit-overflow-scrolling:touch; }
.esm-heading { font-size:clamp(23px,5vw,32px); text-align:center; line-height:1.4; margin:0 0 30px; font-weight:600; }
.esm-paragraphs { max-width:780px; margin:0 auto; }
.esm-paragraph { margin:0 0 22px; white-space:pre-line; overflow-wrap:anywhere; line-height:1.85; }
.esm-question { margin:0 auto 34px; max-width:780px; }
.esm-prompt { font-size:clamp(18px,4.3vw,23px); font-weight:500; margin:0 0 20px; line-height:1.65; white-space:pre-line; overflow-wrap:anywhere; }
.esm-options { display:grid; grid-template-columns:1fr; gap:12px; }
.esm-option { display:flex; align-items:center; text-align:left; padding:13px 16px; min-height:54px;
 border-radius:12px; border:2px solid #c5d0db; background:white; color:#172033;
 font:500 17px/1.5 inherit; font-family:inherit; font-size:16px; cursor:pointer; overflow-wrap:anywhere; }
.esm-option::before { content:""; flex:0 0 22px; height:22px; box-sizing:border-box;
 border:2px solid #90a6be; background:#fff; border-radius:50%; margin-right:13px; }
.esm-option.selected { background:#e8f0f9; border-color:#3E6591; }
.esm-option.selected::before { border:6px solid #3E6591; }
.esm-footer { flex:0 0 auto; display:flex; flex-direction:column; align-items:center;
 padding:10px 16px max(12px,env(safe-area-inset-bottom));
 border-top:1px solid #dce5ee; background:#fff; box-shadow:0 -4px 12px rgba(31,61,95,.05); }
.esm-footer[hidden] {display:none}
.esm-next { width:min(100%,540px); min-height:50px; border:0; border-radius:9px;
 background:#3E6591; color:white; font:700 18px Meiryo,system-ui,sans-serif; cursor:pointer; }
.esm-next:disabled {opacity:.45;cursor:wait}
.esm-error { color:#b42318; font-size:14px; text-align:center; line-height:1.4; white-space:pre-line; margin-bottom:5px; }
.esm-error:empty {display:none}
.esm-hint { color:#536477; font-size:14px; text-align:center; margin:15px 0 0; }
.esm-fixation { min-height:100%; display:flex; align-items:center; justify-content:center; font-size:60px; }
.esm-rating { margin:24px auto 16px; max-width:670px; }
.esm-endpoints { display:flex; align-items:start; justify-content:space-between; gap:16px;
 margin-bottom:20px; color:#172033; font-size:14px; line-height:1.6; }
.esm-endpoints>span { flex:1; }
.esm-endpoints>span:last-child {text-align:right}
.esm-range-row { display:grid; grid-template-columns:50px minmax(0,1fr) 50px; gap:8px; align-items:center; }
.esm-step { min-height:48px; border-radius:9px; border:1px solid #9fb2c8;
 background:#f4f7fb; color:#1F5D99; font:700 17px system-ui; }
.esm-range { width:100%; height:44px; appearance:none; -webkit-appearance:none; background:transparent;
 margin:0; cursor:pointer; touch-action:pan-y; }
.esm-range::-webkit-slider-runnable-track {height:5px;border-radius:4px;background:#53657A}
.esm-range::-moz-range-track {height:5px;border-radius:4px;background:#53657A}
.esm-range::-webkit-slider-thumb { appearance:none; -webkit-appearance:none; width:26px; height:26px;
 border:3px solid white; box-shadow:0 0 0 2px #1F5D99; border-radius:50%; background:#1F5D99; margin-top:-10px; }
.esm-range::-moz-range-thumb { width:24px;height:24px;border:3px solid white;border-radius:50%;background:#1F5D99;box-shadow:0 0 0 2px #1F5D99; }
.esm-range.untouched::-webkit-slider-thumb {opacity:0}
.esm-range.untouched::-moz-range-thumb {opacity:0}
/* 21 explicit positions, one for every 5 points. */
.esm-ticks {display:flex; justify-content:space-between; align-items:flex-start; margin:-7px 58px 7px; height:12px; pointer-events:none;}
.esm-tick {width:1px; height:8px; background:#667c94;}
.esm-tick.major {width:2px; height:12px; background:#3e6591;}
.esm-range-labels { display:grid; grid-template-columns:repeat(21,minmax(0,1fr)); font-size:10px; padding:0 58px; margin:0 0 2px; gap:0; color:#4f6277; }
.esm-range-labels span { text-align:center; white-space:nowrap; transform:translateX(-50%); }
.esm-range-labels span:first-child { transform:none; text-align:left; }
.esm-range-labels span:last-child { transform:none; text-align:right; }
.esm-selected-value {display:none;}
.esm-table-wrap { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid #d1dce7; border-radius:12px; background:#fff; }
.esm-data-table { width:100%; min-width:860px; border-collapse:collapse; table-layout:fixed; }
.esm-data-table thead th { background:#3E6591; color:#fff; font-size:14px; font-weight:700; padding:10px 8px; text-align:center; white-space:nowrap; }
.esm-data-table tbody td { padding:9px 8px; font-size:13px; line-height:1.45; color:#172033; text-align:center; vertical-align:middle; border-top:1px solid #e7edf3; }
.esm-data-table tbody tr:first-child td { border-top:none; }
.esm-data-table th:nth-child(1), .esm-data-table td:nth-child(1) { width:56px; }
.esm-data-table th:nth-child(2), .esm-data-table td:nth-child(2) { width:90px; }
.esm-data-table th:nth-child(3), .esm-data-table td:nth-child(3) { width:340px; text-align:left; }
.esm-data-table th:nth-child(4), .esm-data-table td:nth-child(4), .esm-data-table th:nth-child(5), .esm-data-table td:nth-child(5), .esm-data-table th:nth-child(6), .esm-data-table td:nth-child(6) { width:124px; }
.esm-data-table td.esm-col-label { font-weight:600; }
.esm-other {margin:18px auto 0;max-width:780px;}
.esm-other[hidden] {display:none}
.esm-other label {display:block;margin-bottom:8px;}
.esm-other input {width:100%;font:inherit;border:1px solid #9fb2c8;border-radius:10px;padding:12px;min-height:50px;}
@media (orientation:landscape) and (max-width:1180px) {
 .esm-main {padding-top:14px; padding-bottom:20px;}
 .esm-heading {font-size:24px;margin-bottom:17px;}
 .esm-options {grid-template-columns:repeat(2,minmax(0,1fr));}
 .esm-question {margin-bottom:20px;}
 .esm-paragraph {margin-bottom:12px;}
 .esm-footer {padding-top:7px;padding-bottom:max(7px,env(safe-area-inset-bottom));}
 .esm-next {min-height:44px;}
}
@media (max-width:370px) { .esm-data-values {grid-template-columns:1fr;} .esm-range-labels{padding:0 54px;font-size:12px} }

</style>
